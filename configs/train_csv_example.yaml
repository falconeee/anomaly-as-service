# Template for YOUR data. Copy it, point `data.path` to your CSV and adjust.
# CSV layout: one row per time step, a `timestamp` column, one numeric column per variable,
# and (optionally) a `label` column with 1 on known anomalies (used only for evaluation).
# Try it with a generated sample:  make sample-csv && make train CONFIG=configs/train_csv_example.yaml
experiment: mscvae-exemplo
registered_model: mscvae-exemplo      # the API serves it with MODEL_NAME=mscvae-exemplo

data:
  source: csv
  path: datasets/exemplo.csv
  timestamp_column: timestamp         # null if the file has no timestamps
  label_column: label                 # null if there are no labels
  # features: [sensor_0, sensor_1]    # default: every numeric column
  test_fraction: 0.3                  # last 30% of the rows evaluate the model
  drop_constant: true

model:
  window_sizes: [5, 10, 20]           # in rows; use longer windows for slower dynamics
  stride: 1
  seq_len: 3
  seed: 42

training:
  epochs: 10
  batch_size: 128
  lr: 0.001
  calibration_fraction: 0.2
  device: auto

promotion:
  metric: f1
  tolerance: 0.01
  max_latency_ms: 2000
  latency_rows: 1000
