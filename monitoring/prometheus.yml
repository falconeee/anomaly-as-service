global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # FastAPI: HTTP metrics + sync detections + queue depth (read from Redis at scrape time).
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Celery workers: async detections. DNS service discovery returns EVERY container of the
  # `worker` service, so `docker compose up --scale worker=3` is scraped automatically.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
