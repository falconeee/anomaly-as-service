name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
          enable-cache: true # caches uv's download cache, keyed on uv.lock

      - name: Install (exactly the lockfile)
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Tests
        run: uv run pytest --cov=anomaly_service --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  e2e:
    name: Docker end-to-end
    needs: test
    runs-on: ubuntu-latest
    env:
      GIT_SHA: ${{ github.sha }}
      API_KEY: ci-key
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build images
        run: docker compose --profile train build

      - name: Start the stack
        run: docker compose up -d --wait

      - name: Train -> register -> promote -> sync detect -> async job -> metrics
        run: ./scripts/e2e.sh

      - name: Logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose --profile train down -v
